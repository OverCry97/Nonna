<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Traduttore Nonna</title>
<style>
  :root { --it:#2e7d32; --ka:#1565c0; --bg:#fdf8ee; --ink:#1b1b1b; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--ink); font-family:"Trebuchet MS",Verdana,sans-serif; display:flex; flex-direction:column; }
  .out { flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:16px 22px; text-align:center; overflow:auto; }
  .out .orig { font-size:clamp(20px,3.2vw,30px); color:#666; }
  .out .trad { font-size:clamp(34px,6vw,64px); font-weight:bold; line-height:1.2; }
  .out .stato { font-size:clamp(24px,4vw,40px); font-weight:bold; }
  .btns { display:flex; gap:14px; padding:14px; height:46vh; }
  button { flex:1; border:0; border-radius:28px; color:#fff; font-family:inherit; font-weight:bold; cursor:pointer;
    font-size:clamp(26px,5vw,52px); line-height:1.25; padding:10px; box-shadow:0 8px 0 rgba(0,0,0,.25); }
  button:active { transform:translateY(6px); box-shadow:0 2px 0 rgba(0,0,0,.25); }
  button small { display:block; font-size:.55em; font-weight:normal; margin-top:8px; }
  #bIt { background:var(--it); } #bKa { background:var(--ka); }
  button.ascolta { animation:pulsa 1s infinite; outline:10px solid #ffd54f; }
  @keyframes pulsa { 50% { filter:brightness(1.25); } }
  #ripeti { position:fixed; top:10px; right:10px; flex:none; background:#555; font-size:22px; border-radius:18px; padding:10px 16px; box-shadow:none; display:none; }
  @media (prefers-reduced-motion:reduce){ button.ascolta{animation:none;} }
</style>
</head>
<body>
<button id="ripeti">🔊 Ripeti · გამეორება</button>
<div class="out" aria-live="polite">
  <div class="stato" id="stato">Premi il tasto e parla<br><span lang="ka">დააჭირეთ და ისაუბრეთ</span></div>
  <div class="orig" id="orig"></div>
  <div class="trad" id="trad"></div>
</div>
<div class="btns">
  <button id="bIt">🇮🇹 Parlo italiano<small>Nonna</small></button>
  <button id="bKa" lang="ka">🇬🇪 ვლაპარაკობ ქართულად<small>Badante</small></button>
</div>

<script>
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const $ = id => document.getElementById(id);
const L = { it:{rec:'it-IT', code:'it', btn:'bIt'}, ka:{rec:'ka-GE', code:'ka', btn:'bKa'} };
let rec = null, ultima = null;

if (!SR) $('stato').textContent = 'Apri questa pagina con Google Chrome.';

function stato(t){ $('stato').innerHTML = t; }

async function traduci(testo, da, a){
  try {
    const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl='+da+'&tl='+a+'&q='+encodeURIComponent(testo));
    const d = await r.json();
    return d[0].map(x => x[0]).join('');
  } catch(e) {
    const r = await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(testo)+'&langpair='+da+'|'+a);
    const d = await r.json();
    return d.responseData.translatedText;
  }
}

function parla(testo, lingua){
  speechSynthesis.cancel();
  const voci = speechSynthesis.getVoices();
  const v = voci.find(x => x.lang.toLowerCase().replace('_','-').startsWith(lingua));
  if (v) {
    const u = new SpeechSynthesisUtterance(testo);
    u.voice = v; u.lang = v.lang; u.rate = .85;
    speechSynthesis.speak(u);
    return;
  }
  const au = new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+lingua+'&q='+encodeURIComponent(testo));
  au.onerror = () => stato('Questo dispositivo non ha una voce per questa lingua.<br>Leggi la traduzione sullo schermo.');
  au.play().catch(() => stato('Questo dispositivo non ha una voce per questa lingua.<br>Leggi la traduzione sullo schermo.'));
}

async function ascolta(da, a){
  if (!SR) { stato('Questo browser non supporta il riconoscimento vocale.<br>Usa Google Chrome.'); return; }
  if (rec) { try{ rec.abort(); }catch(e){} rec = null; }
  Object.values(L).forEach(l => $(l.btn).classList.remove('ascolta'));
  $('orig').textContent = ''; $('trad').textContent = '';
  stato('Controllo il microfono…');
  try {
    const s = await navigator.mediaDevices.getUserMedia({audio:true});
    s.getTracks().forEach(t => t.stop());
  } catch(e) {
    stato('Microfono bloccato (' + (e.name||'errore') + ').<br>Tocca il lucchetto accanto all\'indirizzo e consenti il microfono.');
    return;
  }
  let risultato = false;
  rec = new SR();
  rec.lang = L[da].rec; rec.interimResults = false; rec.maxAlternatives = 1;
  rec.onstart = () => { $(L[da].btn).classList.add('ascolta'); stato(da==='it' ? 'Sto ascoltando…<br>Parla ora' : 'მისმენს… ისაუბრეთ'); };
  rec.onresult = async e => {
    risultato = true;
    const testo = e.results[0][0].transcript;
    $('orig').textContent = testo;
    stato('…');
    try {
      const t = await traduci(testo, L[da].code, L[a].code);
      $('trad').textContent = t;
      stato(da==='it' ? '🇬🇪' : '🇮🇹');
      ultima = { t, lingua:L[a].code };
      $('ripeti').style.display = 'block';
      parla(t, L[a].code);
    } catch(err) { stato('Errore di traduzione.<br>Controlla il Wi-Fi.'); }
  };
  rec.onerror = e => { risultato = true; stato(
    e.error==='not-allowed' || e.error==='service-not-allowed' ? 'Microfono non consentito.<br>Controlla i permessi di Chrome.' :
    e.error==='no-speech' ? 'Non ho sentito nulla.<br>Riprova.' :
    e.error==='language-not-supported' ? 'Lingua non supportata su questo tablet.' :
    e.error==='network' ? 'Errore di rete.<br>Controlla il Wi-Fi.' : 'Errore: ' + e.error); };
  rec.onend = () => {
    Object.values(L).forEach(l => $(l.btn).classList.remove('ascolta'));
    if (!risultato) stato('Non ho capito.<br>Premi e riprova.');
  };
  try { rec.start(); } catch(e) { stato('Impossibile avviare: ' + e.message); }
}

$('bIt').onclick = () => ascolta('it','ka');
$('bKa').onclick = () => ascolta('ka','it');
$('ripeti').onclick = () => ultima && parla(ultima.t, ultima.lingua);
speechSynthesis.onvoiceschanged = () => {};
</script>
</body>
</html>
